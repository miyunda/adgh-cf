name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: make check test build linux
      - name: Check version and native Linux executable
        run: |
          ./build/linux-amd64/adgh-cf --version
          ./build/linux-amd64/adgh-cf --help
          grep -F "$(cat VERSION)" <(./build/linux-amd64/adgh-cf --version)
      - name: Upload main branch Linux packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adgh-cf-linux-${{ github.sha }}
          path: |
            build/release/adgh-cf-v*-linux-amd64.tar.gz
            build/release/adgh-cf-v*-linux-arm64.tar.gz
            build/release/adgh-cf-v*-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
